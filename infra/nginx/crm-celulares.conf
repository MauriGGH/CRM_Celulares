# nginx del host (Raspberry Pi) -> Caddy del stack del CRM en 127.0.0.1:8080 (HTTP_LOCAL_PORT).
# Instalar:
#   sudo cp infra/nginx/crm-celulares.conf /etc/nginx/sites-available/crm-celulares.conf
#   sudo ln -sf /etc/nginx/sites-available/crm-celulares.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# El túnel de Cloudflare apunta estos hostnames al nginx (p. ej. http://localhost:80).
# Cloudflare pone el HTTPS; aquí todo va en HTTP. Caddy decide por hostname qué
# rutas expone (api-crm solo /external/*, ingest-crm solo /internal/v1/ingest/*).

upstream crm_caddy {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm-celulares.coliredes-paloalto.uk
                api-crm.coliredes-paloalto.uk
                ingest-crm.coliredes-paloalto.uk;

    # Lotes de ingesta e imágenes de productos.
    client_max_body_size 10m;

    location / {
        proxy_pass http://crm_caddy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Caddy enruta por hostname: hay que conservar el Host original.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # CF-Connecting-IP (IP real del cliente) pasa tal cual desde Cloudflare.
        proxy_read_timeout 120s;
    }

    # Exportaciones grandes en streaming, sin búfer en nginx.
    location /external/ {
        proxy_pass http://crm_caddy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
