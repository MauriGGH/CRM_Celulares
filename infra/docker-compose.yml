# Entorno local completo. Desde la raíz del repo:
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
# En staging/producción se usa además infra/docker-compose.prod.yml, que quita
# el Mongo de desarrollo (la base la entrega el equipo de DB) y usa imágenes de GHCR.
name: crm-celulares

services:
  mongo:
    # Misma versión que la Raspberry Pi 4 (mongo:4.4.18) para no usar funciones de 5.0+.
    image: ${MONGO_IMAGE:-mongo:4.4.18}
    # Replica set de un nodo: MongoDB solo permite transacciones en replica set.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # mongo:4.4 trae "mongo"; mongo:5+ trae "mongosh".
      test: ["CMD-SHELL", "S=$$(command -v mongosh || command -v mongo); $$S --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: ${MONGO_IMAGE:-mongo:4.4.18}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        S=$$(command -v mongosh || command -v mongo)
        exec $$S --host mongo:27017 --quiet --eval "
          var st; try { st = rs.status() } catch (e) { st = { ok: 0 } }
          if (st.ok !== 1) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          while (!db.isMaster().ismaster) { sleep(500) }
          print('replica set listo')"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["node", "src/jobs/worker.js"]
    env_file: ../.env
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  caddy-data:
