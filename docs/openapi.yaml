openapi: 3.1.0
info:
  title: CRM Celulares API
  version: 1.0.0
  description: |-
    Contrato entre backend y frontend (B1). Implementado en backend/src/modules.

    Convenciones:
    - JSON snake_case; ids como texto (`id`); montos como texto decimal en MXN (`"18999.00"`); fechas ISO 8601 UTC.
    - Autenticación: `Authorization: Bearer <access_token>`. El refresh token vive en la cookie httpOnly `refresh_token`; usar `credentials: 'include'` en /auth/*.
    - Listas paginadas: `?page=&limit=` → `{ data, meta: { page, limit, total } }`.
    - Errores: `{ error: { code, message, details } }`.

    Códigos de error frecuentes: VALIDACION (422), NO_AUTENTICADO (401), ACCESO_DENEGADO (403), NO_ENCONTRADO (404), DUPLICADO (409),
    STOCK_INSUFICIENTE, CARRITO_VACIO, CARRITO_INVALIDO, TRANSICION_INVALIDA, PEDIDO_NO_PAGABLE, RESERVA_VENCIDA, PAGO_DE_OTRO_PEDIDO (409),
    CUPON_INVALIDO, CUPON_NO_APLICA, IDEMPOTENCY_KEY_REUTILIZADA (422), DEMASIADOS_INTENTOS (429), PAGO_NO_DISPONIBLE (503), PROVEEDOR_ERROR (502).
servers:
- url: /api/v1
tags:
- name: health
- name: auth
- name: users
- name: catalog
- name: cart
- name: checkout
- name: orders
- name: admin
- name: ingest
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
      description: INGEST_API_KEY (alias INGEST_SERVICE_TOKEN), solo para /internal/*
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    sku:
      name: sku
      in: path
      required: true
      schema:
        type: string
    provider:
      name: provider
      in: path
      required: true
      schema:
        enum:
        - mercadopago
        - paypal
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
      description: Recomendada. La misma llave con el mismo cuerpo repite la respuesta original (24 h); con otro cuerpo responde 422 IDEMPOTENCY_KEY_REUTILIZADA.
    desde:
      name: desde
      in: query
      schema:
        type: string
        format: date-time
    hasta:
      name: hasta
      in: query
      schema:
        type: string
        format: date-time
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              examples:
              - STOCK_INSUFICIENTE
            message:
              type: string
            details:
              type: object
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    Money:
      type: string
      pattern: ^[0-9]+\.[0-9]{2}$
      examples:
      - '18999.00'
      description: Monto en MXN como texto con 2 decimales. Nunca como número.
    Variant:
      type: object
      properties:
        sku:
          type: string
        color:
          type: string
        almacenamiento_gb:
          type: integer
        ram_gb:
          type: integer
        precio:
          $ref: '#/components/schemas/Money'
        precio_antes:
          $ref: '#/components/schemas/Money'
        disponible:
          type: boolean
        images:
          type: array
          items:
            type: string
        gtin:
          type:
          - string
          - 'null'
    ProductSummary:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        marca:
          type: string
        modelo:
          type: string
        condicion:
          enum:
          - nuevo
          - reacondicionado
          - usado
        precio_desde:
          $ref: '#/components/schemas/Money'
        imagen:
          type: string
          format: uri
        disponible:
          type: boolean
    Product:
      allOf:
      - $ref: '#/components/schemas/ProductSummary'
      - type: object
        properties:
          descripcion:
            type: string
          garantia_meses:
            type: integer
          specs:
            type: object
          images:
            type: array
            items:
              type: string
              format: uri
          variants:
            type: array
            items:
              $ref: '#/components/schemas/Variant'
    Id:
      type: string
      pattern: ^[0-9a-f]{24}$
    Page:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PageMeta'
    Address:
      type: object
      required:
      - nombre_destinatario
      - calle
      - ciudad
      - estado
      - cp
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre_destinatario:
          type: string
        calle:
          type: string
        numero:
          type: string
        colonia:
          type: string
        ciudad:
          type: string
        estado:
          type: string
        cp:
          type: string
          pattern: ^[0-9]{5}$
        telefono:
          type: string
        referencias:
          type: string
        es_principal:
          type: boolean
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        nombre:
          type: string
        telefono:
          type: string
        rol:
          enum:
          - admin
          - gerente
          - almacen
          - cliente
        is_active:
          type: boolean
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          const: Bearer
        expires_in:
          type: integer
          description: segundos (15 min clientes, 8 h staff)
        user:
          $ref: '#/components/schemas/User'
      description: El refresh token viaja solo en la cookie httpOnly `refresh_token` (path /api/v1/auth).
    CartLine:
      type: object
      properties:
        sku:
          type: string
        descripcion:
          type: string
        cantidad:
          type: integer
        precio_unitario:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
        descuento:
          $ref: '#/components/schemas/Money'
        disponible:
          type: integer
          description: unidades disponibles
        stock_suficiente:
          type: boolean
        product_id:
          type: string
        slug:
          type: string
        imagen:
          type:
          - string
          - 'null'
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        subtotal:
          $ref: '#/components/schemas/Money'
        descuento:
          $ref: '#/components/schemas/Money'
        envio:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        cupon:
          type:
          - string
          - 'null'
        promocion:
          type:
          - object
          - 'null'
        promociones_elegibles:
          type: array
          items:
            type: object
        skus_no_disponibles:
          type: array
          items:
            type: string
          description: SKU que ya no están a la venta
    OrderItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        nombre:
          type: string
        cantidad:
          type: integer
        precio_unitario:
          $ref: '#/components/schemas/Money'
        descuento:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
        imeis:
          type: array
          items:
            type: string
            pattern: ^[0-9]{15}$
    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        folio:
          type: string
          examples:
          - CEL-2026-000001
        estado:
          enum: &id001
          - pendiente_pago
          - pagado
          - preparando
          - enviado
          - entregado
          - cancelado
          - reembolsado
        canal:
          const: online
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        descuento:
          $ref: '#/components/schemas/Money'
        envio:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        shipping_address:
          $ref: '#/components/schemas/Address'
        reservado_hasta:
          type: string
          format: date-time
        shipment:
          type:
          - object
          - 'null'
          properties:
            paqueteria:
              type: string
            guia:
              type: string
            estado:
              type: string
            enviado_en:
              type: string
              format: date-time
        status_history:
          type: array
          items:
            type: object
            properties:
              estado:
                enum: *id001
              nota:
                type: string
              created_at:
                type: string
                format: date-time
        returns:
          type: array
          items:
            $ref: '#/components/schemas/Return'
        created_at:
          type: string
          format: date-time
    Return:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        order_id:
          type: string
        order_item_id:
          type: string
        sku:
          type: string
        imei:
          type:
          - string
          - 'null'
        cantidad:
          type: integer
        tipo:
          enum:
          - devolucion
          - garantia
        estado:
          enum:
          - solicitada
          - aprobada
          - rechazada
          - recibida
          - reembolsada
        motivo:
          type: string
        resolucion:
          type: string
    Modelo:
      type: object
      description: Ficha de crm_celulares.modelos normalizada
      properties:
        id:
          type: string
        ref:
          type:
          - integer
          - 'null'
        marca:
          type: string
        modelo:
          type: string
        almacenamiento_gb:
          type: array
          items:
            type: integer
        ram_gb:
          type: array
          items:
            type: integer
        precio_referencia:
          type:
          - object
          - 'null'
          properties:
            monto:
              type: string
            moneda:
              type:
              - string
              - 'null'
        imagen:
          type:
          - string
          - 'null'
        url_fuente:
          type:
          - string
          - 'null'
        specs:
          type: object
    ApiClient:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            enum: &id007
            - catalog:read
            - stock:read
            - prices:read
            - sales:read
        limite_por_minuto:
          type: integer
        vence_en:
          type:
          - string
          - 'null'
          format: date-time
        activo:
          type: boolean
        ultimo_uso_en:
          type:
          - string
          - 'null'
          format: date-time
  responses:
    Error:
      description: Error estándar
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Solicitud mal formada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'NO_AUTENTICADO: falta token o venció'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'ACCESO_DENEGADO: el rol no alcanza'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NO_ENCONTRADO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de estado (ver code)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: 'VALIDACION: details.errors lista campo y motivo'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: DEMASIADOS_INTENTOS (rate limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /health:
    get:
      tags:
      - health
      summary: Estado de la API y de MongoDB
      responses:
        '200':
          description: OK
        '503':
          description: MongoDB desconectado
  /auth/register:
    post:
      tags:
      - auth
      summary: Registro de cliente
      description: 409 EMAIL_REGISTRADO si el correo ya existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                nombre:
                  type: string
                telefono:
                  type: string
              required:
              - email
              - password
              - nombre
      responses:
        '201':
          description: Creado; pone la cookie refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login (staff y clientes)
      description: Máximo 5 intentos por minuto por IP (CF-Connecting-IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: Token de acceso y cookie refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Rota el refresh token (cookie) y entrega un access token nuevo
      description: Reusar un refresh token ya rotado revoca todas las sesiones del usuario.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Revoca el refresh token y borra la cookie
      responses:
        '204':
          description: OK
  /auth/me:
    get:
      tags:
      - auth
      summary: Usuario del token vigente
      security:
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
      - users
      summary: Perfil propio
      security:
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - users
      summary: Actualiza nombre, teléfono o contraseña
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                telefono:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/addresses:
    get:
      tags:
      - users
      summary: Direcciones del cliente
      security:
      - bearer: []
      description: 'Roles: cliente.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - users
      summary: Agrega dirección
      security:
      - bearer: []
      description: 'Roles: cliente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '422':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/addresses/{id}:
    patch:
      tags:
      - users
      summary: Edita dirección
      security:
      - bearer: []
      description: 'Roles: cliente.'
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - users
      summary: Borra dirección
      security:
      - bearer: []
      description: 'Roles: cliente.'
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products:
    get:
      tags:
      - catalog
      summary: Catálogo público con filtros
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - name: q
        in: query
        schema:
          type: string
      - name: brand
        in: query
        schema:
          type: string
        description: slug de marca
      - name: category
        in: query
        schema:
          type: string
      - name: min_price
        in: query
        schema:
          type: number
      - name: max_price
        in: query
        schema:
          type: number
      - name: storage_gb
        in: query
        schema:
          type: integer
      - name: condition
        in: query
        schema:
          enum:
          - nuevo
          - reacondicionado
          - usado
      - name: sort
        in: query
        schema:
          enum:
          - precio_asc
          - precio_desc
          - recientes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
  /products/{slug}:
    get:
      tags:
      - catalog
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/Error'
  /brands:
    get:
      tags:
      - catalog
      summary: Marcas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /categories:
    get:
      tags:
      - catalog
      summary: Categorías
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /cart:
    get:
      tags:
      - cart
      summary: Carrito con precios y promociones recalculados
      security:
      - bearer: []
      description: 'Roles: cliente.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cart/items:
    post:
      tags:
      - cart
      summary: Agrega un SKU (suma a lo que ya hay)
      description: |-
        409 STOCK_INSUFICIENTE o LIMITE_POR_PRODUCTO.

        Roles: cliente.
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                cantidad:
                  type: integer
                  minimum: 1
                  maximum: 10
              required:
              - sku
              - cantidad
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cart/items/{sku}:
    patch:
      tags:
      - cart
      summary: Cambia la cantidad
      security:
      - bearer: []
      description: 'Roles: cliente.'
      parameters:
      - $ref: '#/components/parameters/sku'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cantidad:
                  type: integer
                  minimum: 1
                  maximum: 10
              required:
              - cantidad
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - cart
      summary: Quita un SKU
      security:
      - bearer: []
      description: 'Roles: cliente.'
      parameters:
      - $ref: '#/components/parameters/sku'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
