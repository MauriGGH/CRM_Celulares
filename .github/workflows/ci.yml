name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Misma versión que la Raspberry Pi, como replica set (las transacciones lo requieren).
      - name: MongoDB 4.4.18 (replica set)
        run: |
          fail() { echo "::error::$1"; docker ps -a; docker logs --tail 40 mongo 2>&1 | while read -r l; do echo "::error::mongo: ${l:0:300}"; done; exit 1; }
          docker run -d --name mongo -p 27017:27017 mongo:4.4.18 --replSet rs0 --bind_ip_all || fail "docker run falló"
          for i in $(seq 1 60); do docker exec mongo mongo --quiet --eval 'db.adminCommand("ping").ok' 2>/dev/null | grep -q 1 && break; sleep 1; done
          docker exec mongo mongo --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || fail "rs.initiate falló"
          for i in $(seq 1 60); do docker exec mongo mongo --quiet --eval 'db.isMaster().ismaster' 2>/dev/null | grep -q true && exit 0; sleep 1; done
          fail "el replica set no eligió primario"
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/?replicaSet=rs0

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: |
          cp .env.example .env && echo "TUNNEL_TOKEN=ci" >> .env
          mkdir -p infra/secrets && touch infra/secrets/mongo-keyfile
          docker compose -f infra/docker-compose.yml --env-file .env config -q
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env config -q
      - name: Validar Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Revisar scripts de infra
        run: shellcheck -S warning infra/scripts/*.sh

  image:
    name: Build de la imagen del backend (sin push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
